name: Scala CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
        with:
          sbt-runner-version: 1.10.2
      - name: Check sources formatting
        run: sbt scalafmtCheck
      - name: Check sbt and project dir formatting
        run: sbt scalafmtSbtCheck
      - name: Run tests
        run: sbt test
      - name: Build docs
        run: sbt docs/mdoc