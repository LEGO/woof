name: Scala CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
        with:
          sbt-runner-version: 1.10.2
      - name: Check sources formatting
        run: sbt scalafmtCheck
      - name: Check sbt and project dir formatting
        run: sbt scalafmtSbtCheck
      - name: Run tests
        run: sbt test
      - name: Build docs
        run: sbt docs/mdoc